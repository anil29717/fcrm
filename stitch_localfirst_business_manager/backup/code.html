<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                        "on-primary-container": "#9bedd6",
                        "tertiary-fixed": "#ffdad2",
                        "tertiary": "#773729",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#005143",
                        "on-error": "#ffffff",
                        "inverse-surface": "#2d3130",
                        "primary-fixed-dim": "#84d6c0",
                        "primary-fixed": "#a0f2db",
                        "on-primary-fixed": "#002019",
                        "inverse-on-surface": "#eef2ee",
                        "tertiary-fixed-dim": "#ffb4a3",
                        "secondary-fixed-dim": "#adcdc3",
                        "inverse-primary": "#84d6c0",

                        "on-secondary": "#ffffff",

                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",

                    },
                    "spacing": {
                        "card-gap": "16px",
                        "unit": "4px",
                        "container-padding": "20px",
                        "section-margin": "32px",
                        "nav-height": "64px"

                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "label-md": ["Inter"],

                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]

                }

<body class="bg-surface h-full flex flex-col text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 w-full bg-surface dark:bg-surface border-b border-outline-variant dark:border-outline flex justify-between items-center px-container-padding h-14 z-50">
<button class="hover:bg-surface-container-low transition-colors rounded-full p-2 flex items-center justify-center">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="business_center">business_center</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">FreelancePro</h1>
<button class="hover:bg-surface-container-low transition-colors rounded-full p-2 flex items-center justify-center">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="add">add</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[calc(56px+32px)] pb-[calc(64px+32px)] px-container-padding flex flex-col items-center justify-center">
<!-- Status Container -->
<div class="flex flex-col items-center max-w-md w-full text-center space-y-8">
<!-- Cloud Icon & Badge -->
<div class="relative inline-flex flex-col items-center">
<div class="bg-primary-container/10 p-8 rounded-full mb-6">
<span class="material-symbols-outlined text-[80px] text-primary" data-icon="cloud_done" style="font-variation-settings: 'FILL' 1;">cloud_done</span>
</div>
<div class="inline-flex items-center space-x-2 bg-surface-container px-3 py-1.5 rounded-full border border-outline-variant/50">
<span class="w-2.5 h-2.5 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-md text-label-md text-on-surface-variant">Online</span>
</div>
</div>
<!-- Last Backup Details -->
<div class="space-y-2">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Last backup</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Aug 10, 2026 4:30 PM</p>
</div>
<!-- Action Area -->
<div class="w-full pt-4">
<button class="w-full bg-[#0E6E5C] text-white py-4 rounded-xl font-label-md text-label-md hover:bg-primary transition-colors duration-200 active:scale-95 shadow-sm">
                    Backup Now
                </button>
<div class="mt-4 flex items-start space-x-2 text-left bg-surface-container-low p-4 rounded-xl border border-outline-variant/30">
<span class="material-symbols-outlined text-secondary text-[20px] mt-0.5" data-icon="info">info</span>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
                        Only data is backed up — documents and files stay on this device.
                    </p>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center h-16 pb-safe bg-surface dark:bg-surface border-t border-outline-variant dark:border-outline shadow-sm z-50">
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-secondary-container dark:hover:bg-secondary-container rounded-full p-2 transition-colors w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="dashboard">dashboard</span>
<span class="font-label-md text-label-md text-[10px]">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-secondary-container dark:hover:bg-secondary-container rounded-full p-2 transition-colors w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="group">group</span>
<span class="font-label-md text-label-md text-[10px]">Clients</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-secondary-container dark:hover:bg-secondary-container rounded-full p-2 transition-colors w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="assignment">assignment</span>
<span class="font-label-md text-label-md text-[10px]">Projects</span>
</a>
<!-- Active Tab: Settings -->
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed hover:bg-secondary-container dark:hover:bg-secondary-container rounded-full p-2 transition-colors w-16 active:scale-90 duration-150 relative" href="#">
<div class="absolute top-0 w-8 h-1 bg-primary rounded-b-full"></div>
<span class="material-symbols-outlined mb-1" data-icon="settings" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-label-md text-label-md text-[10px] font-bold">Settings</span>
</a>
</nav>
