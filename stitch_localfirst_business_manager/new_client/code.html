            border: 0.5px solid rgba(0, 0, 0, 0.08);

            border: 1px solid #E2E8F0;

<body class="bg-surface min-h-screen pb-nav-height pt-14">
<!-- Intent is transactional/task-focused (New Client form). Hiding TopAppBar and BottomNavBar as per The "Destination" Rule / Automatic Suppression -->
<!-- Top Bar (Simplified for modal/flow) -->
<header class="fixed top-0 w-full z-50 bg-surface shadow-sm h-14 px-container-padding flex items-center justify-between">
<button aria-label="Go back" class="text-on-surface-variant p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">New Client</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="max-w-3xl mx-auto p-container-padding">
<div class="bg-surface-container-lowest rounded-xl card-border p-container-padding mb-card-gap">
<form class="flex flex-col gap-4">
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="client-name">Name</label>
<div class="input-border rounded-lg bg-surface-container-lowest flex items-center px-3 py-2 input-focus transition-all duration-200">
<span class="material-symbols-outlined text-outline mr-2" data-icon="person">person</span>
<input class="flex-1 bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md text-on-surface outline-none" id="client-name" placeholder="Client Name" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="client-phone">Phone</label>
<div class="input-border rounded-lg bg-surface-container-lowest flex items-center px-3 py-2 input-focus transition-all duration-200">
<span class="material-symbols-outlined text-outline mr-2" data-icon="phone">phone</span>
<input class="flex-1 bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md text-on-surface outline-none" id="client-phone" placeholder="(555) 123-4567" type="tel"/>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="client-email">Email</label>
<div class="input-border rounded-lg bg-surface-container-lowest flex items-center px-3 py-2 input-focus transition-all duration-200">
<span class="material-symbols-outlined text-outline mr-2" data-icon="mail">mail</span>
<input class="flex-1 bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md text-on-surface outline-none" id="client-email" placeholder="client@example.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="client-notes">Notes <span class="text-outline font-normal">(Optional)</span></label>
<div class="input-border rounded-lg bg-surface-container-lowest flex items-start px-3 py-2 input-focus transition-all duration-200">
<span class="material-symbols-outlined text-outline mr-2 mt-0.5" data-icon="notes">notes</span>
<textarea class="flex-1 bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md text-on-surface outline-none resize-none" id="client-notes" placeholder="Additional details..." rows="4"></textarea>
</div>
</div>
</form>
</div>
<!-- Action Buttons -->
<div class="flex gap-4 mt-section-margin">
<button class="flex-1 py-3 px-4 rounded-xl border border-primary-container text-primary-container font-label-md text-label-md text-center hover:bg-surface-container-low transition-colors duration-200">
                Cancel
            </button>
<button class="flex-1 py-3 px-4 rounded-xl bg-primary-container text-on-primary font-label-md text-label-md text-center shadow-sm hover:opacity-90 transition-opacity duration-200">
                Save Client
            </button>
</div>
</main>
</body></html>
